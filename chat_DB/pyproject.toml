[project]
name = "chat-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eventlet>=0.41.3",
    "flask>=3.1.3",
    "flask-socketio>=5.7.2",
    "greenlet>=3.5.6",
